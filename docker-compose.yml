services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triven_cinema
    ports:
      - "55432:5432"
    volumes:
      - triven_cinema_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triven_cinema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  triven_cinema_pg:
